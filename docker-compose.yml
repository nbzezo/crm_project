services:
  app:
    build: .
    restart: unless-stopped
    # .env chua bi mat auth: WORKFLOW_SESSION_SECRET (bat buoc), WORKFLOW_ADMIN_USER /
    # WORKFLOW_ADMIN_PASSWORD (chi doc lan dau), WORKFLOW_AI_MASTER_KEY (tuy chon).
    # Copy tu .env.example. Tren server, .github/workflows/deploy.yml tu ghi file nay
    # tu GitHub Actions secrets truoc khi `docker compose up`.
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - WORKFLOW_DATA_DIR=/data
    volumes:
      - crm-data:/data          # SQLite persist (app.db, files, backups)
      - client-dist:/public     # chia sẻ client build cho nginx

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - client-dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  crm-data:
  client-dist:
