name: Deploy to lxc-crm

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout source (auto direct/proxy)
        run: |
          set -e
          rm -rf ./src src.tar.gz
          BASE_URL="https://github.com/nbzezo/crm_project/archive/refs/heads/main.tar.gz"
          PROXY_URL="https://gh-proxy.com/${BASE_URL}"

          # Thu truc tiep, do toc do; neu < 0.5 MB/s hoac loi thi chuyen sang proxy
          SPEED=$(curl -fsSL --max-time 25 -o src.tar.gz -w '%{speed_download}' "$BASE_URL" 2>/dev/null || echo 0)
          echo "Direct speed: $(awk "BEGIN{printf \"%.2f\", ${SPEED:-0}/1000000}") MB/s"
          USE_PROXY=0
          if ! awk "BEGIN{exit !(${SPEED:-0} >= 500000)}"; then
            echo "Direct too slow (<0.5 MB/s) or failed -> switching to gh-proxy.com"
            USE_PROXY=1
          fi
          if ! tar tzf src.tar.gz >/dev/null 2>&1; then
            echo "Direct tarball invalid -> switching to gh-proxy.com"
            USE_PROXY=1
          fi
          if [ "$USE_PROXY" = "1" ]; then
            rm -f src.tar.gz
            curl -fsSL --max-time 300 -o src.tar.gz "$PROXY_URL"
          fi
          mkdir -p ./src && tar xzf src.tar.gz -C ./src --strip-components=1
          rm -f src.tar.gz

      - name: Ensure rsync on target
        run: |
          ssh root@10.10.10.5 'command -v rsync >/dev/null || apt-get install -y rsync'

      - name: Sync source to lxc-crm
        run: |
          ssh root@10.10.10.5 'mkdir -p /opt/crm'
          rsync -avz --delete --exclude '.git' --exclude 'node_modules' --exclude '.github' --exclude '.env' ./src/ root@10.10.10.5:/opt/crm/

      - name: Write production .env on target
        run: |
          test -n "${{ secrets.WORKFLOW_SESSION_SECRET }}" || { echo "::error::Chua dat repo secret WORKFLOW_SESSION_SECRET"; exit 1; }
          ssh root@10.10.10.5 'umask 077 && cat > /opt/crm/.env' <<'ENV'
          WORKFLOW_SESSION_SECRET=${{ secrets.WORKFLOW_SESSION_SECRET }}
          WORKFLOW_ADMIN_USER=${{ secrets.WORKFLOW_ADMIN_USER || 'admin' }}
          WORKFLOW_ADMIN_PASSWORD=${{ secrets.WORKFLOW_ADMIN_PASSWORD }}
          WORKFLOW_AI_MASTER_KEY=${{ secrets.WORKFLOW_AI_MASTER_KEY }}
          ENV

      - name: Rebuild and restart containers
        run: |
          ssh root@10.10.10.5 'cd /opt/crm && docker compose up -d --build'

      - name: Health check
        run: |
          sleep 15
          curl -sf http://10.10.10.5/api/health && echo "DEPLOY OK" || (echo "Health check failed"; exit 1)
