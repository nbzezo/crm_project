name: Quality

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run check:ui
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build -w @workflow/contracts
      - name: Test server
        run: |
          set -o pipefail
          npm test -w server 2>&1 | tee server-test.log
      - name: Report server test failure
        if: failure()
        run: tail -n 200 server-test.log >> "$GITHUB_STEP_SUMMARY"
      - run: npm test -w client
      - run: npm run build
      - run: npm run test:e2e
