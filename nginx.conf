server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nen JSON va tep tinh. Danh sach lon (Cong viec, Doanh thu, Co hoi) tra ve
    # hang chuc MB JSON; gzip giam 5-10 lan dung luong qua mang. `gzip_proxied any`
    # de nen ca phan hoi tu container app. Khong nen zip/anh/pdf (da nen san).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # SPA fallback cho client (Vite build)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API sang container app
    location /api/ {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mac dinh cua nginx la 1m — nho hon gioi han 25MB cua multer trong
        # documents.ts, nen ban ghi am dai hon vai phut bi chan ngay o proxy
        # voi loi 413 truoc khi cham toi ung dung.
        client_max_body_size 30m;

        # Phai lon hon han gio dai nhat phia ung dung (VOICE_CONVERT_TIMEOUT_MS
        # = 180s trong routes/ai.ts), neu khong nginx cat truoc va tra 504.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
